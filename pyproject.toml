[project]
name = "virk"
version = "0.1.0"
description = "Vision Incident Response Kit - Production diagnostics for vision model failures"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "pillow>=10.0.0",
]

[tool.setuptools.packages.find]
include = ["virk*", "virk.*"]
[project.scripts]
virk = "virk.cli:main"

[project.optional-dependencies]
s3 = ["boto3>=1.26.0"]
plot = ["matplotlib>=3.7.0", "seaborn>=0.12.0"]
otel = ["opentelemetry-api>=1.15.0", "opentelemetry-sdk>=1.15.0"]
prometheus = ["prometheus-client>=0.17.0"]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.4.0",
    "boto3>=1.26.0", # For mocking
    "opentelemetry-api>=1.15.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88
